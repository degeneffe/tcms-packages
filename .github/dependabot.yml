version: 2

updates:
  # pnpm workspace: one manifest tree at the repository root.
  - package-ecosystem: npm
    directory: '/'
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: 'chore(deps)'
    groups:
      development-dependencies:
        dependency-type: development

  # Keep the SHA-pinned actions in .github/workflows current.
  - package-ecosystem: github-actions
    directory: '/'
    schedule:
      interval: weekly
    commit-message:
      prefix: 'ci(deps)'
