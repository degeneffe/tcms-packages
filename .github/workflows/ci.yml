name: CI

# Everything a library change needs to prove before it can reach a consumer:
# formatting and lint rules, a real TypeScript build, the test suite, a
# dependency audit and a full-history secret scan.
on:
  push:
    branches: [main]
  pull_request:

# A new push to the same ref makes the in-flight run obsolete.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Lint, build & tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # No `version:` input on purpose: pnpm/action-setup reads the pinned
      # `packageManager` field, so CI can never drift from the lockfile.
      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          run_install: false

      - name: Install Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm

      # --frozen-lockfile is the point: it fails when a manifest and the
      # lockfile disagree instead of silently resolving a different tree.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint and format check
        run: pnpm lint

      - name: Build
        run: pnpm build

      # Type-checks source and the type-level test assertions (`tsc --noEmit`).
      - name: Typecheck
        run: pnpm typecheck

      - name: Tests
        run: pnpm test

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          run_install: false

      - name: Install Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # High and critical fail the build. Moderate and low advisories are
      # triaged in the issue backlog so a transitive dev-only finding cannot
      # block every unrelated PR.
      - name: Audit production dependencies
        run: pnpm audit --prod --audit-level high

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      # fetch-depth: 0 makes gitleaks scan the whole history, not just the
      # current diff, so a secret removed in a later commit is still caught.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # v3 runs on Node 24 (v2's Node 20 runtime is past its removal date).
      # GITLEAKS_LICENSE is only required for organization-owned repos; this
      # repository belongs to a personal account. Comments are disabled so the
      # job only needs read access; findings still land in the job summary and
      # as a SARIF artifact.
      - name: gitleaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: false
