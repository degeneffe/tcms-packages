packages:
  - '*'

# pnpm defaults `autoInstallPeers` to true, which quietly installs *optional*
# peers too. Keep this off so a library never picks a framework version for
# consumers that already bring their own (apps/web: ^19.1.0, apps/mobile: 18.2.0).
autoInstallPeers: false

onlyBuiltDependencies:
  - esbuild
